[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernews"
version = "0.1.0"
description = "A command-line cybersecurity news aggregation and intelligence tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "cook45 & clack" }
]
dependencies = [
    "feedparser>=6.0.10",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
]

[project.scripts]
cybernews = "cybernews.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
